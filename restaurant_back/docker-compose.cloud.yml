services:
  restaurant-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litecashier_restaurant_api
    restart: always
    ports:
      - "127.0.0.1:6770:5000"
    volumes:
      - ./RestaurantPOS/wwwroot/Images:/app/wwwroot/Images
      - ./RestaurantPOS/wwwroot/app:/app/wwwroot/app
      # SPA assets live on host so cloud frontend deploys don't require image rebuild
      - ./RestaurantPOS/wwwroot/static:/app/wwwroot/static
      - ./RestaurantPOS/wwwroot/fonts:/app/wwwroot/fonts
      - ./RestaurantPOS/wwwroot/index.html:/app/wwwroot/index.html:ro
      - ./RestaurantPOS/appsettings.Cloud.json:/app/appsettings.Production.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
